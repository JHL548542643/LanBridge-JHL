[package]
name = "lb-core"
description = "LanBridge core facade (apps/FFI call this crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lb-protocol = { workspace = true }
lb-crypto = { workspace = true }
lb-discovery = { workspace = true }
lb-session = { workspace = true }
lb-transfer = { workspace = true }
lb-clipboard = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

